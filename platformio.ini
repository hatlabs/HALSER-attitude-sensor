; HALSER Attitude Sensor Firmware
; ICM-20948 IMU to NMEA 2000 and Signal K gateway
;
; Two environments per board:
;   halser        — arduino-only, pioarduino platform, precompiled libs.
;                   Builds in seconds; use for quick compile checks.
;   halser_espidf — extends halser with framework = espidf, arduino.
;                   Builds ESP-IDF from source so sdkconfig.defaults is
;                   authoritative. Always flash this env for a device that
;                   talks to a TLS-enabled Signal K server; the arduino env
;                   lacks the dynamic TLS buffer and runs out of memory.
;
; esp_websocket_client sourcing:
;   The arduino env takes the 1.7.0 archive in lib_deps (the pioarduino
;   framework bundles no copy and SensESP declares no dependency).
;   The espidf env takes it from src/idf_component.yml, pinned in
;   dependencies.lock; restating lib_deps without the zip avoids bypassing
;   the lock.

[platformio]
; Always build and flash the espidf env for deployed devices.
default_envs = halser_espidf

; Arduino compile-check env: pioarduino platform, precompiled libs. Fast
; builds but no sdkconfig authority — the dynamic TLS buffer is inactive.
[env:halser]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.13/platform-espressif32.zip
board = esp32-c3-devkitm-1
framework = arduino
lib_ldf_mode = deep

upload_speed = 2000000
monitor_speed = 115200

lib_deps =
    SignalK/SensESP @ ^3.5.0
    ttlappalainen/NMEA2000-library @ ^4.17.2
    NMEA2000_twai=https://github.com/skarlsson/NMEA2000_twai
    sparkfun/SparkFun 9DoF IMU Breakout - ICM 20948 - Arduino Library @ ^1.2.13
    ; 1.7.0 is the first release with the under-the-client-lock TLS recv
    ; (esp-protocols #625, merged in 1.6.1). The registry object_id URLs
    ; silently serve 1.3.0 or 1.5.0, which carry the concurrent read/write
    ; defect — use only the direct archive URL.
    esp_websocket_client=https://components-file.espressif.com/components/espressif/esp_websocket_client/1.7.0/espressif__esp_websocket_client-v1.7.0.zip
    pfeerick/elapsedMillis @ ^1.0.6

build_flags =
    -D SENSESP_BUTTON_PIN=9
    -D PIN_RGB_LED=8
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -D SENSESP_SSL_SUPPORT=1
    -D CORE_DEBUG_LEVEL=ARDUHAL_LOG_LEVEL_VERBOSE
    -D USE_ESP_IDF_LOG
    -D ICM_20948_USE_DMP

build_unflags = -Werror=reorder
board_build.partitions = min_spiffs.csv
monitor_filters = esp32_exception_decoder

; Flashable env: espidf+arduino dual-framework. Building ESP-IDF from source
; makes sdkconfig authoritative — CONFIG_MBEDTLS_DYNAMIC_BUFFER keeps the
; Signal K TLS connection stable on the memory-constrained ESP32-C3.
; The component manager resolves esp_websocket_client from src/idf_component.yml.
[env:halser_espidf]
extends = env:halser
framework = espidf, arduino

; Restate lib_deps without the esp_websocket_client zip: the espidf env takes
; the client from the component manager (src/idf_component.yml), and a raw zip
; in lib_deps would bypass the lock.
lib_deps =
    SignalK/SensESP @ ^3.5.0
    ttlappalainen/NMEA2000-library @ ^4.17.2
    NMEA2000_twai=https://github.com/skarlsson/NMEA2000_twai
    sparkfun/SparkFun 9DoF IMU Breakout - ICM 20948 - Arduino Library @ ^1.2.13
    pfeerick/elapsedMillis @ ^1.0.6

; esp_insights and esp_rainmaker are pulled in transitively by arduino-esp32 on
; esp32c3 and require their server certs embedded, even though this firmware
; uses neither cloud service.
board_build.embed_txtfiles =
    managed_components/espressif__esp_insights/server_certs/https_server.crt
    managed_components/espressif__esp_rainmaker/server_certs/rmaker_mqtt_server.crt
    managed_components/espressif__esp_rainmaker/server_certs/rmaker_claim_service_server.crt
    managed_components/espressif__esp_rainmaker/server_certs/rmaker_ota_server.crt

; Host-side unit tests (pio test -e native).
[env:native]
platform = native
build_flags = -std=c++17 -I src -DUNITY_INCLUDE_DOUBLE
lib_compat_mode = off
build_src_filter = -<*>
lib_deps =
test_framework = unity
